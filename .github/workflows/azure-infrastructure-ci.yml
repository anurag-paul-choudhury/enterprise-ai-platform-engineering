
name: Azure Infrastructure CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Azure Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Function App dependencies
        working-directory: function-app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall -q function-app

      - name: Validate Bicep templates
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az bicep install

            for file in infrastructure/*.bicep; do
              echo "Validating $file"
              az bicep build --file "$file" --stdout > /dev/null
            done
