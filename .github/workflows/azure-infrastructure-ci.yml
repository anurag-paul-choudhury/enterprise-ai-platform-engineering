
name: Azure Infrastructure CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate Azure Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure authentication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az account show --query "{subscription:name, tenant:tenantId}" --output table

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Function App dependencies
        working-directory: function-app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall -q function-app

      - name: Validate Bicep templates
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az bicep install

            for file in infrastructure/*.bicep; do
              echo "Validating $file"
              az bicep build --file "$file" --stdout > /dev/null
            done
