
name: Azure Infrastructure What-If

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  what-if:
    name: Preview Azure Infrastructure Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep template
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az bicep install
            az bicep build --file infrastructure/main.bicep --stdout > /dev/null

      - name: Preview infrastructure deployment
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az deployment group what-if \
              --resource-group rg-enterprise-ai-platform \
              --template-file infrastructure/main.bicep \
              --result-format FullResourcePayloads \
              --output table
